name: Publish

# Publishes ghcr.io/maritime-sh/openhands-agent-server:<version> for each recent
# ghcr.io/openhands/agent-server:<version>-python release, so OpenHands can ask
# for the Maritime image that matches the agent server version it pins.
#
# - schedule / workflow_dispatch without input: builds the recent releases that
#   are not published yet.
# - push to main: rebuilds the recent releases, to ship a launcher change.
# - workflow_dispatch with a version: rebuilds that one version.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Agent server version to (re)build, e.g. 1.58.1. Empty builds what is missing."
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  UPSTREAM: openhands/agent-server
  IMAGE: ghcr.io/maritime-sh/openhands-agent-server
  # How many of the newest upstream releases to keep published.
  RECENT: "8"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
      latest: ${{ steps.plan.outputs.latest }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ github.event.inputs.version }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # True when the registry has this tag. Upstream is public; our own
          # repository is read with the workflow token, so it works whether or
          # not the package is public yet.
          has_tag() {
            local repo="$1" tag="$2" token
            if [ "$repo" = "$UPSTREAM" ]; then
              token=$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token)
            else
              token=$(curl -fsS -u "${GHCR_USER}:${GHCR_TOKEN}" \
                "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r '.token // empty') || true
              [ -n "$token" ] || return 1
            fi
            curl -fsS -o /dev/null -I -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json' \
              "https://ghcr.io/v2/${repo}/manifests/${tag}"
          }
          # GHCR has far too many upstream tags to list (one per commit and
          # variant), so releases come from PyPI and are checked one by one.
          releases=$(curl -fsS https://pypi.org/pypi/openhands-agent-server/json \
            | jq -r '.releases | keys[]' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 20)
          upstream=""
          for v in $releases; do
            if has_tag "$UPSTREAM" "${v}-python"; then upstream="${upstream}${v}"$'\n'; fi
          done
          upstream=$(printf '%s' "$upstream" | sed '/^$/d' | sort -V)
          [ -n "$upstream" ] || { echo "Found no upstream releases" >&2; exit 1; }
          recent=$(echo "$upstream" | tail -n "$RECENT")
          latest=$(echo "$upstream" | tail -n 1)
          if [ -n "${REQUESTED:-}" ]; then
            has_tag "$UPSTREAM" "${REQUESTED}-python" || { echo "No upstream tag ${REQUESTED}-python" >&2; exit 1; }
            wanted="$REQUESTED"
          elif [ "$EVENT" = push ]; then
            wanted="$recent"
          else
            wanted=""
            for v in $recent; do
              has_tag maritime-sh/openhands-agent-server "$v" || wanted="${wanted}${v}"$'\n'
            done
          fi
          echo "latest=${latest}" >>"$GITHUB_OUTPUT"
          echo "versions=$(printf '%s' "$wanted" | jq -Rnc '[inputs | select(length > 0)]')" >>"$GITHUB_OUTPUT"
          echo "Upstream latest: ${latest}"
          echo "To build: $(echo $wanted)"

  build:
    needs: plan
    if: needs.plan.outputs.versions != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: AGENT_SERVER_TAG=${{ matrix.version }}-python
          tags: smoke:${{ matrix.version }}
          load: true

      - name: Smoke test
        run: ./tests/smoke.sh smoke:${{ matrix.version }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tags
        id: tags
        env:
          VERSION: ${{ matrix.version }}
          LATEST: ${{ needs.plan.outputs.latest }}
        run: |
          tags="${IMAGE}:${VERSION}"
          if [ "$VERSION" = "$LATEST" ]; then tags="${tags},${IMAGE}:latest"; fi
          echo "tags=${tags}" >>"$GITHUB_OUTPUT"

      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: AGENT_SERVER_TAG=${{ matrix.version }}-python
          tags: ${{ steps.tags.outputs.tags }}
          push: true
